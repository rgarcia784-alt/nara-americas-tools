function render(list) {
  const cont = document.getElementById('lista');
  cont.innerHTML = '';
  if (list.length === 0) {
    cont.innerHTML = '<p style="text-align:center;color:#6b7280;">No se encontraron páginas con ese término.</p>';
    return;
  }
  list.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item';
    const tagHtml = it.tag ? `<span class="tag ${it.tag}">${it.tagLabel}</span>` : '';
    const statusHtml = it.status === 'ok' ? `<span class="status-ok">${it.statusText}</span>`
      : it.status === 'redirect' ? `<span class="status-redirect">${it.statusText}</span>`
      : it.status === 'pending' ? `<span class="status-pending">${it.statusText}</span>` : '';
    div.innerHTML = `
      <div>
        <div class="fname">${it.f} ${tagHtml} ${statusHtml}</div>
        <div class="title">${it.t}</div>
      </div>
      <div class="buttons">
        <a class="btn-open" href="${it.u}" target="_blank">Abrir ↗</a>
        <button class="btn-copy" data-url="${it.u}">Copiar link</button>
        <a class="btn-dl" href="${it.dl}" target="_blank" download>Descargar HTML</a>
      </div>`;
    cont.appendChild(div);
  });
  document.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      });
    });
  });
}

function filtrar() {
  const q = document.getElementById('buscador').value.toLowerCase();
  const filtered = items.filter(it => it.f.toLowerCase().includes(q) || it.t.toLowerCase().includes(q));
  render(filtered);
}

render(items);
